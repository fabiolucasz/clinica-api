name: Deploy AWS Infrastructure & App with Terraform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # Permite que o GitHub gere o token OIDC
  contents: read    # Necessário para actions/checkout

jobs:
  terraform-deploy:
    name: Terraform Init and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Autenticação na AWS via OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 3. Setup do Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # 4. Inicializa o Terraform
      - name: Terraform Init
        run: terraform init

      # 6. Validação dos arquivos Terraform
      - name: Terraform Validate
        run: terraform validate

      # 7. Planejamento das alterações passando os Secrets como variáveis do Terraform
      - name: Terraform Plan
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_algorithm: ${{ secrets.ALGORITHM }}
          TF_VAR_access_token_expire_minutes: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          TF_VAR_domain: ${{ secrets.DOMAIN }}
          TF_VAR_environment: production
          TF_VAR_ai_api_key: ${{ secrets.AI_API_KEY }}
          TF_VAR_supabase_storage_url: ${{ secrets.SUPABASE_STORAGE_URL }}
          TF_VAR_supabase_s3_endpoint: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          TF_VAR_supabase_access_key: ${{ secrets.SUPABASE_ACCESS_KEY }}
          TF_VAR_supabase_secret_key: ${{ secrets.SUPABASE_SECRET_KEY }}
          TF_VAR_supabase_region: ${{ secrets.SUPABASE_REGION }}
          TF_VAR_supabase_bucket: ${{ secrets.SUPABASE_BUCKET }}
        run: terraform plan

      # 8. Aplicação da infraestrutura (VPC, Security Group, EC2 e .env)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_algorithm: ${{ secrets.ALGORITHM }}
          TF_VAR_access_token_expire_minutes: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          TF_VAR_domain: ${{ secrets.DOMAIN }}
          TF_VAR_environment: production
          TF_VAR_ai_api_key: ${{ secrets.AI_API_KEY }}
          TF_VAR_supabase_storage_url: ${{ secrets.SUPABASE_STORAGE_URL }}
          TF_VAR_supabase_s3_endpoint: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          TF_VAR_supabase_access_key: ${{ secrets.SUPABASE_ACCESS_KEY }}
          TF_VAR_supabase_secret_key: ${{ secrets.SUPABASE_SECRET_KEY }}
          TF_VAR_supabase_region: ${{ secrets.SUPABASE_REGION }}
          TF_VAR_supabase_bucket: ${{ secrets.SUPABASE_BUCKET }}
        run: terraform apply -auto-approve