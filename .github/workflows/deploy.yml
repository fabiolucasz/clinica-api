name: Deploy AWS Infrastructure & App with Terraform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # Permite que o GitHub gere o token OIDC
  contents: read    # Necessário para actions/checkout

jobs:
  terraform-deploy:
    name: Terraform Init and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Autenticação na AWS via OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 3. Setup do Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # 4. Garante que o bucket do Terraform State existe na AWS
      - name: Ensure Terraform State S3 Bucket exists
        run: |
          aws s3api head-bucket --bucket clinica-api-fabiolucasz-bucket-state --region us-east-1 2>/dev/null || \
          aws s3api create-bucket --bucket clinica-api-fabiolucasz-bucket-state --region us-east-1

      # 5. Inicializa o Terraform
      - name: Terraform Init
        run: terraform init


      # 5. Validação dos arquivos Terraform
      - name: Terraform Validate
        run: terraform validate

      # 6. Planejamento das alterações
      - name: Terraform Plan
        run: terraform plan

      # 7. Aplicação da infraestrutura (VPC, Security Group, EC2)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve